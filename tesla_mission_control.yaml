        \ = Math.round(parseFloat(states['number.evse_trydan_intensity']?.state) || 0);\n              const minAmps\
        \ = Math.round(parseFloat(states['number.evse_trydan_min_intensity']?.state) || 6);\n              const maxAmps\
        \ = Math.round(parseFloat(states['number.evse_trydan_max_intensity']?.state) || 29);\n\n              const\
        \ solarPwrW = Math.round(parseFloat(states['sensor.evse_trydan_photovoltaic_power']?.state) || 0);\n      \
        \        const solarPwrDisplay = solarPwrW >= 1000 ? (solarPwrW / 1000).toFixed(2) + ' kW' : solarPwrW + ' W';\n\n\
        \              const housePwrW = Math.round(parseFloat(states['sensor.evse_trydan_house_power']?.state) ||\
        \ 0);\n              const housePwrDisplay = housePwrW >= 1000 ? (housePwrW / 1000).toFixed(2) + ' kW' : housePwrW\
        \ + ' W';\n\n              const sessionKwh = (parseFloat(states['sensor.evse_trydan_charge_energy']?.state)\
        \ || 0).toFixed(2);\n              const chargeTimeSec = parseFloat(states['sensor.evse_trydan_charge_time']?.state)\
        \ || 0;\n              let sessionDurationText = '0m';\n              if (chargeTimeSec > 0) {\n                const\
        \ hours = Math.floor(chargeTimeSec / 3600);\n                const mins = Math.round((chargeTimeSec % 3600) / 60);\n\
        \                sessionDurationText = hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;\n              }\n\n       \
        \       const activeProfile = states['input_select.v2c_charging_profile']?.state || 'FV + Min';\n              const\
        \ solarSurplusW = Math.max(0, solarPwrW - housePwrW);\n\n              return `\n                <div style=\"position:\
        \ relative; pointer-events: auto !important; padding: 16px 14px 14px; box-sizing: border-box; width: 100%;\">\n  \
        \                \n                  <!-- V2C Station Header -->\n                  <div style=\"display: flex; justify-content:\
