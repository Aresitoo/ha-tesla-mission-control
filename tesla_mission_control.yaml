        \                    <div style=\"background: rgba(255, 179, 0, 0.08); border: 1px solid rgba(255, 179, 0, 0.25);\
        \ border-radius: 12px; padding: 10px 8px; text-align: center;\">\n                      <div style=\"font-size: 9px;\
        \ font-weight: 700; color: #ffb74d; text-transform: uppercase;\">Solar PV</div>\n                      <div style=\"\
