        \ = function(domain, service, serviceData, el) {\n                  if (el) {\n                    el.style.transform\
        \ = 'scale(0.93)';\n                    el.style.opacity = '0.7';\n                    setTimeout(() => {\n      \
        \                el.style.transform = '';\n                      el.style.opacity = '';\n                    }, 140);\n\
        \                  }\n                  if (window._haHass && window._haHass.callService) {\n                    window._haHass.callService(domain,\
