    custom_fields:
      v2c_hub: "[[[\n              if (typeof hass !== 'undefined' && hass) {\n                window._haHass = hass;\n  \
        \            }\n\n              // Install V2C Charging Profile & Amps Controllers\n              if (!window._setV2cProfile)\
        \ {\n                window._setV2cProfile = function(profileName, modeNum, el) {\n                  if (el) {\n \
        \                   el.style.transform = 'scale(0.95)';\n                    setTimeout(() => { el.style.transform\
        \ = ''; }, 140);\n                  }\n                  try {\n                    fetch('http://YOUR_CHARGER_IP/write/DynamicPowerMode='\
        \ + modeNum, { mode: 'no-cors' });\n                  } catch(e) {}\n                  if (window._callTeslaHa) {\n\
        \                    window._callTeslaHa('input_select', 'select_option', {\n                      entity_id: 'input_select.v2c_charging_profile',\n\
        \                      option: profileName\n                    }, el);\n                    window._callTeslaHa('rest_command',\
        \ 'v2c_set_dynamic_power_mode', {\n                      mode: modeNum\n                    }, el);\n            \
        \      }\n                };\n\n                window._setV2cAmps = function(amps, el) {\n                  if (el)\
        \ {\n                    el.style.transform = 'scale(0.92)';\n                    setTimeout(() => { el.style.transform\
        \ = ''; }, 140);\n                  }\n                  try {\n                    fetch('http://YOUR_CHARGER_IP/write/Intensity='\
        \ + amps, { mode: 'no-cors' });\n                  } catch(e) {}\n                  if (window._callTeslaHa) {\n \
        \                   window._callTeslaHa('number', 'set_value', {\n                      entity_id: 'number.evse_trydan_intensity',\n\
        \                      value: amps\n                    }, el);\n                  }\n                };\n\n     \
        \           window._toggleV2cPause = function(currentlyPaused, el) {\n                  if (el) {\n              \
        \      el.style.transform = 'scale(0.92)';\n                    setTimeout(() => { el.style.transform = ''; }, 140);\n\
        \                  }\n                  const nextPause = currentlyPaused ? 0 : 1;\n                  try {\n    \
        \                fetch('http://YOUR_CHARGER_IP/write/Paused=' + nextPause, { mode: 'no-cors' });\n                 \
        \ } catch(e) {}\n                  if (window._callTeslaHa) {\n                    window._callTeslaHa('switch', currentlyPaused\
        \ ? 'turn_off' : 'turn_on', {\n                      entity_id: 'switch.evse_trydan_pause_session'\n      \
        \              }, el);\n                  }\n                };\n              }\n\n              const isConnected\
        \ = states['binary_sensor.evse_trydan_connected']?.state === 'on';\n              const isCharging = states['binary_sensor.evse_trydan_charging']?.state\
