        \      <div style=\"font-size: 8px; color: rgba(255,255,255,0.5); font-weight: 600;\">Surplus: ${(solarSurplusW/1000).toFixed(2)}\
        \ kW</div>\n                    </div>\n\n                    <!-- House Base Load -->\n                    <div style=\"\
        background: rgba(0, 229, 255, 0.06); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 12px; padding: 10px\
        \ 8px; text-align: center;\">\n                      <div style=\"font-size: 9px; font-weight: 700; color: #00e5ff;\
        \ text-transform: uppercase;\">House Load</div>\n                      <div style=\"font-size: 17px; font-weight:\
        \ 900; color: #00e5ff; line-height: 1.2;\">${housePwrDisplay}</div>\n                      <div style=\"font-size:\
        \ 8px; color: rgba(255,255,255,0.5); font-weight: 600;\">Base Power</div>\n                    </div>\n\n        \
        \            <!-- EV Charging Speed -->\n                    <div style=\"background: ${isCharging ? 'rgba(0, 230,\
        \ 118, 0.12)' : 'rgba(255, 255, 255, 0.04)'}; border: 1px solid ${isCharging ? 'rgba(0, 230, 118, 0.35)' : 'rgba(255,\
        \ 255, 255, 0.08)'}; border-radius: 12px; padding: 10px 8px; text-align: center;\">\n                      <div style=\"\
        font-size: 9px; font-weight: 700; color: ${isCharging ? '#00e676' : 'rgba(255,255,255,0.6)'}; text-transform: uppercase;\"\
        >EV Charging</div>\n                      <div style=\"font-size: 17px; font-weight: 900; color: ${isCharging ? '#00e676'\
        \ : '#ffffff'}; line-height: 1.2;\">${chargePwrDisplay}</div>\n                      <div style=\"font-size: 8px;\
        \ color: rgba(255,255,255,0.5); font-weight: 600;\">${currentAmps} A</div>\n                    </div>\n\n       \
        \           </div>\n\n                  <!-- 3 Distinct Charging Profiles with Prominent Active Border & Glow -->\n\
        \                  <div style=\"margin-bottom: 12px;\">\n                    <div style=\"font-size: 9px; font-weight:\
        \ 700; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px;\">Charging\
