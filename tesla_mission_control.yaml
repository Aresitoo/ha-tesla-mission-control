        \ const barSoc = parseFloat(flowBar.dataset.soc || 0);\n                      flowBar.style.width = Math.max(0, pct\
        \ - barSoc) + '%';\n                    }\n                    if (moveEv.stopPropagation) moveEv.stopPropagation();\n\
        \                  };\n\n                  const onUp = function(upEv) {\n                    handleEl.removeEventListener('pointermove',\
