        \ solid rgba(255, 255, 255, 0.08)'}; box-shadow: ${activeProfile === 'Boost' ? '0 0 14px rgba(239, 83, 80, 0.45)'\
        \ : 'none'}; border-radius: 10px; padding: 8px 4px; text-align: center; transition: all 0.15s ease;\">\n         \
        \               <ha-icon icon=\"mdi:rocket-launch\" style=\"color: #ef5350; --mdc-icon-size: 18px;\"></ha-icon>\n\
        \                        <div style=\"font-size: 11px; font-weight: 800; color: #ef5350; margin-top: 2px;\">Boost</div>\n\
        \                        <div style=\"font-size: 8px; color: rgba(255,255,255,0.5);\">Max Grid + Solar</div>\n   \
