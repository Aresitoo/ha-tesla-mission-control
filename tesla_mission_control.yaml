        \ || 3.15;\n\n              const fl_col = fl_val < 2.8 ? '#ff5252' : '#ffffff';\n              const fr_col = fr_val\
        \ < 2.8 ? '#ff5252' : '#ffffff';\n              const rl_col = rl_val < 2.8 ? '#ff5252' : '#ffffff';\n           \
