        \       const evsePower = parseFloat(states['sensor.evse_trydan_charge_power']?.state) || 0;\n            \
        \  const evseConnected = states['binary_sensor.evse_trydan_connected']?.state === 'on';\n              const\
        \ isPaused = states['switch.evse_trydan_pause_session']?.state === 'on';\n              const teslaChargingState\
        \ = states['sensor.tesla_ble_garage_charging_state']?.state || 'Disconnected';\n              const isCharging = evseCharging\
