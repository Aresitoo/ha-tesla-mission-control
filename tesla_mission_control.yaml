        \ center;\">\n                        <ha-icon icon=\"mdi:ev-station\" style=\"color: #00e676; --mdc-icon-size: 22px;\"\
        ></ha-icon>\n                      </div>\n                      <div>\n                        <div style=\"font-size:\
        \ 16px; font-weight: 800; color: #ffffff; letter-spacing: 0.2px; line-height: 1.1;\">V2C Trydan</div>\n          \
        \            </div>\n                    </div>\n\n                    <div style=\"display: flex; gap: 6px;\">\n\
        \                      <!-- Plug Connection Pill -->\n                      <div style=\"display: flex; align-items:\
