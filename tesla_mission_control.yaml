title: Tesla & V2C Mission Control
path: ve
icon: mdi:car-electric
theme: Backend-selected
badges: []
cards:
- type: vertical-stack
  cards:
  - type: custom:button-card
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    triggers_update:
    - sensor.tesla_ble_garage_charge_level
    - sensor.tesla_ble_garage_range
    - number.tesla_ble_garage_charging_limit
    - sensor.tesla_ble_garage_odometer
    - sensor.tesla_ble_garage_charge_energy_added
    - sensor.tesla_ble_garage_charge_distance_added
    - sensor.tesla_ble_garage_minutes_to_limit
    - sensor.tesla_ble_garage_charging_state
    - binary_sensor.evse_trydan_charging
    - binary_sensor.evse_trydan_connected
    - sensor.evse_trydan_charge_power
    - sensor.tesla_ble_garage_tyre_pressure_front_left
    - sensor.tesla_ble_garage_tyre_pressure_front_right
    - sensor.tesla_ble_garage_tyre_pressure_rear_left
    - sensor.tesla_ble_garage_tyre_pressure_rear_right
    - sensor.tesla_ble_garage_interior
    - sensor.tesla_ble_garage_exterior
    - number.tesla_ble_garage_climate_temperature
    - switch.tesla_ble_garage_climate
    - binary_sensor.tesla_ble_garage_ble_status
    - binary_sensor.tesla_ble_garage_asleep
    - lock.tesla_ble_garage_lock_car
    - switch.tesla_ble_garage_sentry_mode
    - cover.tesla_ble_garage_frunk
    - binary_sensor.tesla_ble_garage_frunk
    - cover.tesla_ble_garage_boot
    - binary_sensor.tesla_ble_garage_boot
    - binary_sensor.tesla_ble_garage_charge_flap
    - binary_sensor.tesla_ble_garage_doors
    styles:
      card:
      - background: 'linear-gradient(145deg, #0e131a 0%, #161d27 100%)'
      - border-radius: 20px
      - border: 1px solid rgba(0, 229, 255, 0.18)
      - box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 0 15px rgba(0, 229, 255, 0.08)
      - padding: 0px
      - box-sizing: border-box
      - overflow: hidden
      - contain: paint
      - pointer-events: auto !important
      - cursor: default
      grid:
      - grid-template-areas: '"tesla_hub"'
      - grid-template-columns: 1fr
      - padding: 0px
      - pointer-events: auto !important
      custom_fields:
        tesla_hub:
        - width: 100%
        - white-space: normal
        - overflow: hidden
        - pointer-events: auto !important
    custom_fields:
